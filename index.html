<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure</title>
<style>
  :root {
    --bg: #E3DBD3;
    --glow: #FFE45C;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  svg {
    display: block;
    height: 100vh;
    height: 100dvh;
    width: auto;
    max-width: 100vw;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Accessories hidden at start */
  #shield, #tie, #helmet {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #shield.is-visible, #tie.is-visible, #helmet.is-visible {
    opacity: 1;
  }

  /* Buttons */
  .equip-button {
    cursor: pointer;
    outline: none;
    transition: filter 0.2s ease, opacity 0.8s ease;
  }
  .equip-button:hover,
  .equip-button:focus-visible {
    filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px var(--glow));
  }
  .equip-button.is-gone {
    opacity: 0;
    pointer-events: none;
  }

  /* Door */
  #door {
    transition: transform 1.6s cubic-bezier(0.45, 0, 0.2, 1);
  }
  #door.is-ready {
    cursor: pointer;
    animation: door-pulse 1.6s ease-in-out infinite;
  }
  #door.is-open {
    transform: translateY(var(--door-lift));
  }
  #door-glow {
    pointer-events: none;
    fill: none;
    stroke: var(--glow);
    stroke-width: 4;
    opacity: 0;
    filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 12px var(--glow));
    transition: opacity 0.4s ease;
  }
  #door-glow.is-on {
    animation: glow-pulse 1.6s ease-in-out infinite;
  }
  @keyframes door-pulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.35); }
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* Hall */
  #hall.is-glowing {
    animation: hall-pulse 3.2s ease-in-out infinite;
  }
  @keyframes hall-pulse {
    0%, 100% { fill: #4C4C4C; }
    50%      { fill: #6E6450; }
  }

  /* Hero */
  #hero-drag {
    transform-box: view-box;
  }
  #hero-drag.is-draggable {
    cursor: grab;
  }
  #hero-drag.is-dragging {
    cursor: grabbing;
  }
  #hero-drag.is-entering {
    transition: transform 1.2s ease-in-out, opacity 1.2s ease-in-out;
    opacity: 0;
    pointer-events: none;
  }
  #hero.is-bobbing {
    animation: bob 1.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #door.is-ready, #door-glow.is-on, #hall.is-glowing, #hero.is-bobbing {
      animation-duration: 0s;
      animation-iteration-count: 1;
    }
    #door-glow.is-on { opacity: 1; }
  }
</style>
</head>

<script>
(() => {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);

  const svg = document.querySelector('svg');
  const door = $('door');
  const hall = $('hall');
  const hero = $('hero');
  const heroBody = $('body');

  // --- Setup -----------------------------------------------------------

  // Glow outline for the door. The door sits behind the castle wall, so a
  // glow applied to it directly would be hidden; draw the outline on top.
  const doorGlow = document.createElementNS(SVG_NS, 'path');
  doorGlow.id = 'door-glow';
  doorGlow.setAttribute('d', door.querySelector('path').getAttribute('d'));
  $('Subtract').after(doorGlow);

  // Door slides up by 90% of its own height.
  const doorBox = door.getBBox();
  door.style.setProperty('--door-lift', `${-doorBox.height * 0.9}px`);

  // Wrap the hero so dragging (outer group) and bobbing (#hero) don't fight
  // over the same transform.
  const heroDrag = document.createElementNS(SVG_NS, 'g');
  heroDrag.id = 'hero-drag';
  hero.before(heroDrag);
  heroDrag.appendChild(hero);

  // --- Buttons ---------------------------------------------------------

  const pairs = [
    ['shield-button', 'shield'],
    ['tie-button', 'tie'],
    ['helmet-button', 'helmet'],
  ];
  const clicked = new Set();
  let doorOpen = false;

  for (const [buttonId, itemId] of pairs) {
    const button = $(buttonId);
    const item = $(itemId);
    button.classList.add('equip-button');
    button.setAttribute('role', 'button');
    button.setAttribute('tabindex', '0');
    button.setAttribute('aria-label', `Toggle ${itemId}`);
    button.setAttribute('aria-pressed', 'false');

    const toggle = () => {
      if (doorOpen) return;
      const visible = item.classList.toggle('is-visible');
      button.setAttribute('aria-pressed', String(visible));
      clicked.add(buttonId);
      if (clicked.size === pairs.length) readyDoor();
    };
    button.addEventListener('click', toggle);
    button.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  }

  // --- Door ------------------------------------------------------------

  function readyDoor() {
    if (door.classList.contains('is-ready') || doorOpen) return;
    door.classList.add('is-ready');
    doorGlow.classList.add('is-on');
    door.setAttribute('role', 'button');
    door.setAttribute('tabindex', '0');
    door.setAttribute('aria-label', 'Open the door');
  }

  function openDoor() {
    if (!door.classList.contains('is-ready') || doorOpen) return;
    doorOpen = true;
    door.classList.remove('is-ready');
    door.classList.add('is-open');
    door.removeAttribute('role');
    door.removeAttribute('tabindex');
    doorGlow.classList.remove('is-on');

    for (const [buttonId] of pairs) {
      const button = $(buttonId);
      button.classList.add('is-gone');
      button.removeAttribute('tabindex');
      button.setAttribute('aria-hidden', 'true');
    }

    hall.classList.add('is-glowing');
    hero.classList.add('is-bobbing');
    heroDrag.classList.add('is-draggable');
  }

  door.addEventListener('click', openDoor);
  door.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDoor(); }
  });

  // --- Hero drag (y-axis only) -----------------------------------------

  const bodyBox = heroBody.getBBox();
  const hallBox = hall.getBBox();
  // Scale around the body's center so the shrink keeps the hero centered.
  heroDrag.style.transformOrigin =
    `${bodyBox.x + bodyBox.width / 2}px ${bodyBox.y + bodyBox.height / 2}px`;
  const MIN_Y = -(bodyBox.y - 20);                   // can reach near the top
  const MAX_Y = svg.viewBox.baseVal.height - (bodyBox.y + bodyBox.height); // stays on screen
  let offsetY = 0;
  let drag = null;
  let entered = false;

  const toSvgY = (clientY) => {
    const pt = svg.createSVGPoint();
    pt.x = 0;
    pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
  };

  const setOffset = (y) => {
    offsetY = Math.min(MAX_Y, Math.max(MIN_Y, y));
    heroDrag.style.transform = `translate(0px, ${offsetY}px)`;
  };

  // "Over the hall": the hero's head (top of the body) is inside the hall.
  const isOverHall = () => {
    const headY = bodyBox.y + bodyBox.width / 2 + offsetY;
    return headY >= hallBox.y && headY <= hallBox.y + hallBox.height;
  };

  heroDrag.addEventListener('pointerdown', (e) => {
    if (!doorOpen || entered) return;
    e.preventDefault();
    heroDrag.setPointerCapture(e.pointerId);
    heroDrag.classList.add('is-dragging');
    drag = { pointerId: e.pointerId, startY: toSvgY(e.clientY), startOffset: offsetY };
  });

  heroDrag.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    setOffset(drag.startOffset + toSvgY(e.clientY) - drag.startY);
    if (isOverHall()) enterHall();
  });

  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag = null;
    heroDrag.classList.remove('is-dragging');
  };
  heroDrag.addEventListener('pointerup', endDrag);
  heroDrag.addEventListener('pointercancel', endDrag);

  function enterHall() {
    if (entered) return;
    entered = true;
    drag = null;
    heroDrag.classList.remove('is-dragging', 'is-draggable');
    hall.classList.remove('is-glowing');
    hero.classList.remove('is-bobbing');

    // Center the hero's body on the door opening while shrinking 50%.
    const dx = (doorBox.x + doorBox.width / 2) - (bodyBox.x + bodyBox.width / 2);
    const dy = (doorBox.y + doorBox.height / 2) - (bodyBox.y + bodyBox.height / 2);
    // Force the current position to be committed before transitioning.
    heroDrag.getBoundingClientRect();
    heroDrag.classList.add('is-entering');
    heroDrag.style.transform = `translate(${dx}px, ${dy}px) scale(0.5)`;
  }
})();
</script>
</body>
</html>
